# ReHarness only (Qdrant + agent). Requires shared image + Langfuse network.
#
#   cd agents && ./build-image.sh
#   docker compose -f docker-compose.langfuse.yml up -d
#   docker compose -f reharness/docker-compose.yml up -d
#
# Env: agents/.env

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - ./.data/qdrant:/qdrant/storage
    networks:
      - reharness_internal

  agent:
    image: ${AGENTS_RUNTIME_IMAGE:-agents-runtime:latest}
    working_dir: /app/agents/reharness
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    env_file:
      - ../.env
    ports:
      - "${AGENT_PORT:-8080}:8080"
    environment:
      AGENT_NAME: reharness
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_PATH: /data/checkpoints.sqlite
      QDRANT_MEMORY_CONFIG: /app/agents/reharness/config/qdrant_memory.json
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      AGENT_LOG_DIR: /logs
      AGENT_LOG_MAX_BYTES: "5242880"
      AGENT_LOG_BACKUP_COUNT: "0"
    volumes:
      - ./.data/agent:/data
      - ./.data/logs:/logs
    depends_on:
      - qdrant
    networks:
      - reharness_internal
      - agents_shared

networks:
  reharness_internal:
  agents_shared:
    external: true
    name: agents_shared
