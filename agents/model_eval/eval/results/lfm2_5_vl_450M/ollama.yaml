# Publisher: Liquid AI (https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF)
# Max context: 131072 (128K) in GGUF card (32K–128K).

model_name: LFM2.5-VL-450M
params: 450M
modality: T+I->T
thinking_model: false

ollama:
  tag: hf.co/LiquidAI/LFM2.5-VL-450M-GGUF:Q8_0
  q4_tag: hf.co/LiquidAI/LFM2.5-VL-450M-GGUF:Q4_0
  hf_gguf_repo: LiquidAI/LFM2.5-VL-450M-GGUF
  quantization: Q8_0

  options:
    temperature: 0.1
    top_k: 50
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.1
    num_ctx: 131072       # Max context
    num_predict: 32768    # Max output tokens
