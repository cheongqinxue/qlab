# Local Ollama (OpenAI-compatible API on host loopback).
#
#   cd agents && docker compose -f docker-compose.ollama.yml up -d
#
# From agent containers use:
#   OPENAI_BASE_URL=http://host.docker.internal:11434/v1
# (hipporag/memgraphrag compose should map host-gateway — see experiment compose.)

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      # Set OLLAMA_MODELS in agents/.env for a host path (e.g. large local disk).
      - ${OLLAMA_MODELS:-./.data/ollama-models}:/root/.ollama/models
    networks:
      - ollama_local

networks:
  ollama_local:
    driver: bridge
