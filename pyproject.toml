[project]
name = "qlab"
version = "0.1.0"
description = "Personal lab monorepo: agent harnesses and training experiments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.1.0",
    "wandb>=0.22.0",
    "tqdm>=4.67.0",
    "torch>=2.14.1",
    "transformers>=5.2.0",
    "trl>=1.14.2",
    "accelerate>=1.15.0",
    "wandb-workspaces>=0.4.13",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "starlette>=0.46.0",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.16",
    "langfuse>=5.0.2",
    "langchain-openai>=1.7.2",
    "openai>=3.35.1",
    "playwright>=1.64.0",
    "trafilatura>=2.3.1",
    "tenacity>=9.2.1",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "fastembed>=0.9.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "streamlit>=1.45.0",
    "igraph>=0.11.8",
    "neo4j>=5.28.1",
]

[project.optional-dependencies]
agents-ui = ["streamlit>=1.45.0"]

[dependency-groups]
dev = ["ruff>=0.9.0"]
[tool.pytest.ini_options]
markers = [
    "slow: long-running ingest or scale tests",
]
addopts = "-rA -v"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s] %(message)s (%(filename)s:%(lineno)s"
pythonpath = [
    "tutorials",
    "tutorials/pathologies/bev/backend",
    "tutorials/pathologies/bev/sdk",
    "agents",
    "agents/hipporag",
    "agents/cove",
    "agents",
]
testpaths = [
    "tutorials",
    "tutorials/pathologies/bev/backend/tests",
    "tutorials/pathologies/bev/sdk/tests",
    "agents/hipporag/tests",
    "agents/memgraphrag/tests",
    "agents/cove/tests",
    "agents/agents_utils/tests",
]
